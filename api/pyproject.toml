[project]
name = "murmur-api"
version = "0.1.0"
description = "The Murmur chat API"
readme = "README.md"
authors = [
    { name = "Edward Burton", email = "3243428+flyingearl@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.5",
    "pydantic-settings>=2.16.2",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes: unused imports, undefined names
    "I",      # isort: import order
    "N",      # pep8-naming
    "UP",     # pyupgrade: use modern syntax
    "B",      # flake8-bugbear: likely bugs
    "BLE",    # flake8-blind-except: catching Exception
    "SIM",    # flake8-simplify
    "ASYNC",  # flake8-async: blocking calls in async code
    "RUF",    # Ruff's own rules
]

[tool.mypy]
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
