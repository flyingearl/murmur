[project]
name = "murmur-api"
version = "0.1.0"
description = "The Murmur chat API"
readme = "README.md"
authors = [
    { name = "Edward Burton", email = "3243428+flyingearl@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.5",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
